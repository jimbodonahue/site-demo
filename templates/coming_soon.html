{% extends "base.html" %}

{% block title %}{{ page_title }} | Coming Soon{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto py-10 px-4">
    <div class="rounded-2xl border border-dashed border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800/50 p-8 text-center">
        <p class="text-xs font-semibold uppercase tracking-wide text-amber-700 dark:text-amber-300">Coming soon</p>
        <h1 class="mt-3 text-3xl font-bold text-slate-900 dark:text-white">{{ page_title }}</h1>
        <p class="mt-4 text-slate-600 dark:text-slate-300">{{ page_blurb }}</p>
        <p class="mt-6">
            <a href="{% url 'exercises:list' %}" class="text-sm font-semibold text-primary-600 hover:text-primary-700">
                Explore available tracks &rarr;
            </a>
        </p>
    </div>
</section>
{% endblock %}
