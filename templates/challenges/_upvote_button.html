<form method="post" action="{% url 'challenges:toggle_upvote' submission.pk %}" class="submission-upvote-form inline-flex items-center">
  {% csrf_token %}
  <button
    type="submit"
    class="submission-upvote-button inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-semibold transition {% if submission.user_has_upvoted %}border-sky-300 dark:border-sky-700 bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-200{% else %}border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-sky-300 dark:hover:border-sky-500 hover:text-sky-700 dark:hover:text-sky-300{% endif %}"
    aria-pressed="{% if submission.user_has_upvoted %}true{% else %}false{% endif %}"
    data-upvoted="{% if submission.user_has_upvoted %}true{% else %}false{% endif %}"
  >
    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
    </svg>
    <span class="upvote-label">{% if submission.user_has_upvoted %}Upvoted{% else %}Upvote{% endif %}</span>
    <span class="upvote-count font-mono">{{ submission.annotated_upvote_count }}</span>
  </button>
</form>
