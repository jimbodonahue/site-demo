{% extends "base.html" %}
{% block title %}New Forum Topic{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto py-8 px-4">
  <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm ring-1 ring-slate-200 dark:ring-slate-700">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Create New Topic {% if exercise %}for {{ exercise.title }}{% endif %}</h1>
      <a href="{% url 'forum:topic_list' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 dark:text-slate-200">Cancel</a>
    </div>
    <div class="mb-4 bg-slate-50 dark:bg-slate-900 rounded-2xl p-3 text-xs text-slate-600 dark:text-slate-300 flex flex-wrap justify-between items-center gap-2 border border-slate-200 dark:border-slate-700">
      <span>Posting as <strong class="text-slate-800 dark:text-slate-100">{{ forum_user.get_display_name }}</strong>
        · Please follow the <a href="{% url 'forum:code_of_conduct' %}" class="text-sky-600 dark:text-sky-400 hover:underline font-semibold">Code of Conduct</a>
      </span>
      <a href="{% url 'forum:download_token' %}" class="text-sky-600 dark:text-sky-400 hover:underline font-semibold">Download Token</a>
    </div>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_title" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Topic Title</label>
        <input type="text" name="title" id="id_title" required class="mt-1 block w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-4 py-2 text-slate-900 dark:text-slate-100 focus:border-sky-500 focus:outline-none">
      </div>
      <div class="flex justify-end gap-3">
        <button type="submit" class="rounded-full bg-sky-600 px-5 py-2 text-sm font-semibold text-white hover:bg-sky-500">Create Topic</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
