[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
# optional, keeps import blocks tidy without reflow churn
combine_as_imports = true
force_sort_within_sections = true

[dependency-groups]
dev = [
    "django==6.0.1",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "markdown==3.8.2",
    "matplotlib==3.11.1",
    "gunicorn==24.0.0",
    "numpy==2.5.1",
    "psycopg2-binary==2.9.11",
    "pandas==3.0.5",
    "python-dotenv==1.2.1",
    "whitenoise==6.12.0",
]
